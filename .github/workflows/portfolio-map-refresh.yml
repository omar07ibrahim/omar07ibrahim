name: Portfolio map refresh staging

on:
  push:
    branches:
      - portfolio/refresh-tensorkiln-evidence

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  TZ: UTC

jobs:
  candidate:
    name: Render refreshed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"

      - name: Render and independently verify the closed bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          umask 077
          directory="$RUNNER_TEMP/portfolio-map-candidate"
          mkdir "$directory"
          CANDIDATE_DIRECTORY="$directory" python - <<'PY'
          import os
          from pathlib import Path

          from tools.render_portfolio_map import ROOT, build_bundle

          destination = Path(os.environ["CANDIDATE_DIRECTORY"])
          for relative_path, payload in build_bundle(ROOT).items():
              target = destination / Path(relative_path).name
              target.write_bytes(payload)
              target.chmod(0o644)
          PY
          python tools/verify_portfolio_map_candidate.py --bundle "$directory"
          sha256sum "$directory"/*
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the exact candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-map-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/portfolio-map-candidate/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
