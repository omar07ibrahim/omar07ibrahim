name: One-shot PlanForge map refresh

on:
  push:
    branches:
      - portfolio/showcase-planforge

permissions:
  contents: write

concurrency:
  group: one-shot-planforge-map-${{ github.ref }}
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  TZ: UTC

jobs:
  refresh:
    if: >-
      github.repository == 'omar07ibrahim/omar07ibrahim' &&
      github.actor == 'omar07ibrahim' &&
      github.event.head_commit.message == 'Refresh PlanForge portfolio evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"

      - name: Assert the guarded one-shot boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = omar07ibrahim/omar07ibrahim
          test "$GITHUB_ACTOR" = omar07ibrahim
          test "$GITHUB_REF" = refs/heads/portfolio/showcase-planforge
          test "$(git log -1 --pretty=%s)" = "Refresh PlanForge portfolio evidence"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python - <<'PY'
          import platform

          assert platform.python_implementation() == "CPython"
          assert platform.python_version() == "3.12.3"
          PY

      - name: Render and freeze the exact map bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python tools/render_portfolio_map.py --write
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          manifest_path = root / "assets/portfolio-systems-map.manifest.json"
          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes)
          semantic = manifest["map"]["semantic_sha256"]
          outputs = manifest["outputs"]
          assert len(outputs) == 1
          assert outputs[0]["path"] == "assets/portfolio-systems-map.svg"
          svg_digest = outputs[0]["sha256"]
          manifest_digest = hashlib.sha256(manifest_bytes).hexdigest()
          for value in (semantic, svg_digest, manifest_digest):
              assert len(value) == 64
              assert set(value) <= set("0123456789abcdef")

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"unexpected replacement count: {path}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "tests/test_portfolio_map_contract.py",
              "522c60a051796981e065feffbe3bbaa44b30481f6a15a5f41c5a4db8533b42f5",
              semantic,
          )
          replace_once(
              "tests/test_portfolio_map_visual.py",
              "65c4dcd2501fbaa14b689a5557868611b9f46d2184fb79a9e5116c1590c5a87a",
              svg_digest,
          )
          replace_once(
              "tests/test_portfolio_map_visual.py",
              "117e2573ac716973e927ac5f0ba48a3346e48f7d21df847cf78763725379e55c",
              manifest_digest,
          )
          replace_once(
              "docs/portfolio-map-contract.md",
              "9bdb27e85a464b6d0497f6d493664398657fe951724cd1dbd21ebd8b0dabc15c",
              semantic,
          )
          PY

      - name: Verify reproducibility and independent claims
        shell: bash
        run: |
          set -euo pipefail
          python tools/render_portfolio_map.py --check
          python tools/verify_portfolio_map_candidate.py --bundle assets
          python -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | sed -n '/^??/p')"

      - name: Commit only the reviewed generated delta
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s
'             assets/portfolio-systems-map.manifest.json             assets/portfolio-systems-map.svg             docs/portfolio-map-contract.md             tests/test_portfolio_map_contract.py             tests/test_portfolio_map_visual.py)"
          actual="$(git diff --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name "Omar Ibrahim"
          git config user.email "31526072+omar07ibrahim@users.noreply.github.com"
          export GIT_AUTHOR_NAME="Omar Ibrahim"
          export GIT_AUTHOR_EMAIL="31526072+omar07ibrahim@users.noreply.github.com"
          export GIT_COMMITTER_NAME="Omar Ibrahim"
          export GIT_COMMITTER_EMAIL="31526072+omar07ibrahim@users.noreply.github.com"
          git add --             assets/portfolio-systems-map.manifest.json             assets/portfolio-systems-map.svg             docs/portfolio-map-contract.md             tests/test_portfolio_map_contract.py             tests/test_portfolio_map_visual.py
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$expected"
          test -z "$(git diff --name-only)"
          git commit -m "Adopt generated PlanForge portfolio map"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$GITHUB_REF_NAME"
