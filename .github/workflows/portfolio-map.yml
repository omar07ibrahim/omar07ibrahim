name: Portfolio map CI

on:
  push:
    branches:
      - main
      - profile/reproducible-systems-map
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-map-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  TZ: UTC

jobs:
  render:
    name: Render exact portfolio map
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"

      - name: Assert the exact event checkout
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              case "$GITHUB_REF" in
                refs/heads/main|refs/heads/profile/reproducible-systems-map) ;;
                *) exit 1 ;;
              esac
              ;;
            pull_request)
              [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
              ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python - <<'PY'
          import platform

          assert platform.python_implementation() == "CPython"
          assert platform.python_version() == "3.12.3"
          PY

      - name: Render the closed bundle twice
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for directory in \
            "$RUNNER_TEMP/portfolio-map-first" \
            "$RUNNER_TEMP/portfolio-map-second"
          do
            CANDIDATE_DIRECTORY="$directory" python - <<'PY'
          import os
          from pathlib import Path

          from tools.render_portfolio_map import ROOT, build_bundle

          destination = Path(os.environ["CANDIDATE_DIRECTORY"])
          destination.mkdir(mode=0o700)
          bundle = build_bundle(ROOT)
          for relative_path, payload in bundle.items():
              target = destination / Path(relative_path).name
              target.write_bytes(payload)
              target.chmod(0o644)
          PY
          done

      - name: Verify exact candidate inventories and replay
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            portfolio-systems-map.manifest.json \
            portfolio-systems-map.svg)"
          for directory in \
            "$RUNNER_TEMP/portfolio-map-first" \
            "$RUNNER_TEMP/portfolio-map-second"
          do
            actual="$(
              find "$directory" \
                -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
                | LC_ALL=C sort
            )"
            test "$actual" = "$expected"
            test -z "$(
              find "$directory" \
                -mindepth 1 -maxdepth 1 ! -type f -print -quit
            )"
          done
          for name in \
            portfolio-systems-map.manifest.json \
            portfolio-systems-map.svg
          do
            cmp -- \
              "$RUNNER_TEMP/portfolio-map-first/$name" \
              "$RUNNER_TEMP/portfolio-map-second/$name"
          done
          python tools/verify_portfolio_map_candidate.py \
            --bundle "$RUNNER_TEMP/portfolio-map-first"

      - name: Verify committed assets and complete tests
        shell: bash
        run: |
          set -euo pipefail
          cmp -- \
            "$RUNNER_TEMP/portfolio-map-first/portfolio-systems-map.svg" \
            assets/portfolio-systems-map.svg
          cmp -- \
            "$RUNNER_TEMP/portfolio-map-first/portfolio-systems-map.manifest.json" \
            assets/portfolio-systems-map.manifest.json
          python tools/render_portfolio_map.py --check
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Enforce the read-only verification boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the exact candidate bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-map-${{ github.sha }}
          path: ${{ runner.temp }}/portfolio-map-first/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  verify-download:
    name: Verify downloaded portfolio map
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"

      - name: Assert exact head and artifact identity
        env:
          ARTIFACT_ID: ${{ needs.render.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              case "$GITHUB_REF" in
                refs/heads/main|refs/heads/profile/reproducible-systems-map) ;;
                *) exit 1 ;;
              esac
              ;;
            pull_request)
              [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
              ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python - <<'PY'
          import platform

          assert platform.python_implementation() == "CPython"
          assert platform.python_version() == "3.12.3"
          PY

      - name: Download by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.render.outputs.artifact_id }}
          path: ${{ runner.temp }}/portfolio-map-downloaded

      - name: Verify the closed downloaded bundle independently
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/portfolio-map-downloaded"
          expected="$(printf '%s\n' \
            portfolio-systems-map.manifest.json \
            portfolio-systems-map.svg)"
          actual="$(
            find "$directory" \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort
          )"
          test "$actual" = "$expected"
          test -z "$(
            find "$directory" \
              -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"
          python tools/verify_portfolio_map_candidate.py --bundle "$directory"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
